<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>원광 — 공지 &amp; 길찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #16171c;
    --ink-soft: #5c5d63;
    --bg: #f7f6f3;
    --surface: #ffffff;
    --line: #e7e5e0;
    --gold: #a9834a;
    --gold-deep: #6e5427;
    --gold-tint: #f2e9d8;
    --sage: #3f5b4d;
    --sage-tint: #e6ede9;
    --danger: #8a3a2c;
    --shadow-soft: 0 1px 2px rgba(20,20,22,0.04);
    --shadow-lift: 0 10px 30px rgba(20,20,22,0.10);

    /* ---- semantic design tokens (aliases onto the palette above) ---- */
    --color-primary: var(--gold);
    --color-primary-deep: var(--gold-deep);
    --color-background: var(--bg);
    --color-surface: var(--surface);
    --color-text: var(--ink);
    --color-muted: var(--ink-soft);
    --color-border: var(--line);
    --color-danger: var(--danger);
    --radius-sm: 8px;
    --radius-md: 12px;
    --radius-lg: 20px;
    --radius-pill: 999px;
    --spacing-sm: 8px;
    --spacing-md: 16px;
    --spacing-lg: 24px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink: #f3f2ee;
      --ink-soft: #b5b3ac;
      --bg: #0d0e10;
      --surface: #17181b;
      --line: #2a2b2f;
      --gold: #d2ab6c;
      --gold-deep: #e7c98d;
      --gold-tint: #362c1b;
      --sage: #94b4a1;
      --sage-tint: #1c2621;
      --danger: #e59a83;
      --shadow-soft: 0 1px 2px rgba(0,0,0,0.3);
      --shadow-lift: 0 10px 30px rgba(0,0,0,0.45);
    }
  }
  :root[data-theme="dark"]{
    --ink: #f3f2ee;
    --ink-soft: #b5b3ac;
    --bg: #0d0e10;
    --surface: #17181b;
    --line: #2a2b2f;
    --gold: #d2ab6c;
    --gold-deep: #e7c98d;
    --gold-tint: #362c1b;
    --sage: #94b4a1;
    --sage-tint: #1c2621;
    --danger: #e59a83;
    --shadow-soft: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-lift: 0 10px 30px rgba(0,0,0,0.45);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    -webkit-font-smoothing:antialiased;
    height:100vh;
    height:100dvh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    height:100vh;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
  }

  header.top{
    padding:16px 20px;
    background:var(--ink);
    color:var(--bg);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex:none;
    transform:translateY(0);
    opacity:1;
    transition:transform 0.28s ease, opacity 0.2s ease;
  }
  header.top.collapsed{
    transform:translateY(-100%);
    opacity:0;
    pointer-events:none;
  }
  header.top h1{
    font-family:'Gowun Batang', serif;
    font-weight:700;
    font-size:21px;
    margin:0;
    letter-spacing:0.01em;
    display:flex;
    align-items:baseline;
    gap:7px;
  }
  header.top h1 .hanja{
    font-size:13px;
    font-weight:400;
    color:var(--gold);
    letter-spacing:0.08em;
  }
  header.top .ring{
    position:relative;
    width:32px; height:32px;
    border:1px solid var(--gold);
    border-radius:50%;
    flex:none;
  }
  header.top .ring::after{
    content:"WKU";
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:'Gowun Batang', serif;
    font-size:8px; letter-spacing:0.04em;
    color:var(--gold);
  }

  main{
    flex:1;
    padding:22px 20px 28px;
    overflow-y:auto;
  }

  .view{display:none;}
  .view.active{display:block;}

  /* ---- Chips ---- */
  .chips{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:4px;
    margin-bottom:20px;
  }
  .chip{
    flex:none;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--gold-deep);
    font-weight:600;
  }
  :root[data-theme="dark"] .chip.active, :root:not([data-theme="light"]) .chip.active{
    color:var(--gold);
  }

  /* ---- Notice list (hairline rows, no boxed cards) ---- */
  .group-label{
    font-size:12px;
    font-weight:600;
    color:var(--gold-deep);
    margin:26px 0 4px;
  }
  .group-label:first-child{ margin-top:0; }

  .tag{
    display:inline-block;
    font-size:11px;
    font-weight:600;
    color:var(--ink-soft);
  }
  .tag::before{
    content:"";
    display:inline-block;
    width:5px; height:5px; border-radius:50%;
    background:var(--gold);
    margin-right:6px;
    vertical-align:middle;
  }

  .notice-card{
    padding:16px 2px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .notice-card:first-of-type{ border-top:1px solid var(--line); }
  .notice-card .tag{ margin-bottom:7px; }
  .notice-card h3{
    font-size:15.5px;
    line-height:1.55;
    margin:0 0 8px;
    font-weight:600;
    color:var(--ink);
  }
  .notice-card .meta{
    font-size:12.5px;
    color:var(--ink-soft);
    display:flex;
    justify-content:space-between;
  }
  .notice-card .meta .d-day{
    color:var(--danger);
    font-weight:700;
  }

  .section-label{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    margin:26px 0 12px;
  }

  /* ---- Nav tab ---- */
  .map-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 18px 12px;
    margin-bottom:20px;
  }
  .map-outer{ position:relative; }
  .map-outer.fullscreen{
    position:fixed; inset:0; z-index:200;
    background:var(--bg);
    padding:calc(14px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px));
    display:flex;
  }
  .map-outer.fullscreen .map-img-wrap{
    flex:1; width:100%; height:100%; aspect-ratio:auto; border-radius:12px;
  }
  .map-img-wrap{
    position:relative; overflow:hidden; border-radius:8px;
    background:var(--bg); aspect-ratio:787/730;
    touch-action:none; cursor:grab;
  }
  .map-img-wrap:active{ cursor:grabbing; }
  .map-img-inner{
    position:absolute; top:0; left:0; width:100%; height:100%;
    transform-origin:0 0; will-change:transform;
  }
  #campus-map-img{
    position:absolute; top:0; left:0; width:100%; height:100%;
    object-fit:contain; user-select:none; -webkit-user-drag:none; pointer-events:none;
  }
  #map-pins{ position:absolute; inset:0; }
  .map-pin{
    position:absolute; width:24px; height:24px; margin:-12px 0 0 -12px;
    border-radius:50%; cursor:pointer;
    background:rgba(169,131,74,0.16);
    border:1.3px solid rgba(169,131,74,0.55);
    transition:background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .map-pin.matched{ background:var(--gold); border-color:var(--gold); transform:scale(1.3); }
  .map-pin.selected{ background:var(--danger); border-color:var(--danger); transform:scale(1.4); }
  .map-controls{
    position:absolute; top:8px; right:8px;
    display:flex; flex-direction:column; gap:4px;
  }
  .map-controls button{
    width:28px; height:28px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--surface);
    color:var(--ink);
    font-size:15px; font-weight:700;
    cursor:pointer;
    box-shadow:var(--shadow-soft);
  }
  .bldg-search{
    display:flex; align-items:center; gap:8px;
    border:1px solid var(--line);
    border-radius:10px;
    padding:9px 12px;
    margin-bottom:14px;
    background:var(--surface);
  }
  .bldg-search .search-ic{ font-size:13px; opacity:0.6; }
  .bldg-search input{
    flex:1; border:none; outline:none; background:transparent;
    font-size:16px; color:var(--ink); font-family:'Noto Sans KR', sans-serif;
  }
  .bldg-search input::placeholder{ color:var(--ink-soft); }
  .hl-match{ color:var(--gold-deep); font-weight:700; }

  /* ---- Home ---- */
  .home-hero{ padding:8px 0 4px; text-align:center; }
  .home-eyebrow{ font-size:12px; color:var(--gold-deep); letter-spacing:0.06em; margin:0 0 6px; }
  :root[data-theme="dark"] .home-eyebrow, :root:not([data-theme="light"]) .home-eyebrow{ color:var(--gold); }
  .home-title{
    font-family:'Gowun Batang', serif; font-weight:700; font-size:24px;
    margin:0 0 18px;
  }
  .home-search input{ font-size:16px; }
  .home-hint{ font-size:12.5px; color:var(--ink-soft); margin:12px 0 0; line-height:1.6; }
  .home-recent{ margin-top:28px; }
  .home-recent-list{ display:flex; flex-wrap:wrap; gap:8px; }
  .home-recent-chip{
    padding:8px 14px; border-radius:var(--radius-pill);
    border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); font-size:12.5px; font-weight:500; cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
  }
  .home-quick-grid{
    display:grid; grid-template-columns:repeat(2,1fr); gap:10px;
    margin-top:14px;
  }
  .home-quick-btn{
    display:flex; flex-direction:column; align-items:center; gap:8px;
    padding:18px 8px; border-radius:var(--radius-md);
    border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font-size:13px; font-weight:600; cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
  }
  .home-quick-btn span{ font-size:22px; }
  .home-locate-status{
    min-height:16px; text-align:center;
    font-size:12px; color:var(--ink-soft); margin:14px 0 0;
  }

  /* ---- Map marker popover ---- */
  .map-popover{
    display:flex; align-items:flex-start; gap:12px;
    margin-top:14px; padding:14px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-md);
    box-shadow:var(--shadow-lift);
    position:relative;
  }
  .map-popover-close{
    position:absolute; top:8px; right:8px;
    width:24px; height:24px; border-radius:50%;
    border:1px solid var(--line); background:transparent;
    color:var(--ink-soft); font-size:11px; cursor:pointer;
  }
  .map-popover-badge{
    flex:none; width:34px; height:34px; border-radius:50%;
    border:1.3px solid var(--ink); display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600;
  }
  .map-popover-body{ flex:1; min-width:0; padding-right:20px; }
  .map-popover-name{ font-size:15px; font-weight:700; }
  .map-popover-sub{ font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .map-popover-actions{ display:flex; flex-direction:column; gap:6px; flex:none; margin-top:16px; }
  .map-popover-btn{
    padding:7px 12px; border-radius:var(--radius-pill);
    border:1px solid var(--line); background:transparent; color:var(--ink);
    font-size:12px; font-weight:600; cursor:pointer;
    font-family:'Noto Sans KR', sans-serif; white-space:nowrap;
  }
  .map-popover-btn.primary{ background:var(--ink); border-color:var(--ink); color:var(--bg); }

  .detail-map-btn{
    width:100%; margin-top:14px; padding:12px;
    border-radius:var(--radius-md); border:1px solid var(--line);
    background:transparent; color:var(--ink); font-size:13px; font-weight:600;
    cursor:pointer; font-family:'Noto Sans KR', sans-serif;
  }

  .med-back-btn{
    position:absolute; top:0; left:8px;
    border:none; background:transparent; color:var(--ink-soft);
    font-size:13px; font-weight:500; cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
  }

  .scale-row{
    font-size:11px; color:var(--ink-soft); margin-top:8px;
  }

  .bldg-row{
    display:flex;
    align-items:center;
    gap:13px;
    padding:14px 2px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
  }
  .bldg-row:first-of-type{ border-top:1px solid var(--line); }
  .bldg-row.selected .bldg-badge{
    background:var(--gold); border-color:var(--gold); color:var(--surface);
  }
  .bldg-row.selected .bldg-info .name{ color:var(--gold-deep); }
  .bldg-badge{
    flex:none;
    width:34px;height:34px;
    border-radius:50%;
    border:1.3px solid var(--ink);
    background:transparent;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    font-weight:600;
    font-size:12.5px;
  }
  .bldg-info{flex:1;}
  .bldg-info .name{font-size:15px;font-weight:600;}
  .bldg-info .sub{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .bldg-dist{font-size:13px;font-weight:700;color:var(--sage); text-align:right; min-width:56px;}

  .detail{
    position:relative;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
    margin:2px 0 18px;
    box-shadow:var(--shadow-lift);
  }
  .detail-close{
    position:absolute; top:12px; right:12px;
    width:28px; height:28px; border-radius:50%;
    border:1px solid var(--line); background:var(--bg);
    color:var(--ink-soft); font-size:12px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .detail h2{
    font-family:'Gowun Batang', serif;
    font-size:19px;
    margin:0;
    padding-right:34px;
    font-weight:700;
  }
  .detail-dist-line{
    display:block; width:100%; text-align:left;
    border:none; background:transparent; padding:0;
    margin:5px 0 12px;
    font-size:12.5px; color:var(--ink-soft);
    font-family:'Noto Sans KR', sans-serif;
    cursor:default;
  }
  .detail-dist-line.clickable{ color:var(--gold-deep); font-weight:600; cursor:pointer; }
  :root[data-theme="dark"] .detail-dist-line.clickable, :root:not([data-theme="light"]) .detail-dist-line.clickable{ color:var(--gold); }
  .detail-info{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.6;
    margin:0 0 16px;
  }
  .detail-compare{
    margin-top:18px; padding-top:16px; border-top:1px solid var(--line);
  }
  .detail-compare-label{ font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:8px; }
  .detail-compare-select{
    width:100%; padding:10px 12px; border-radius:var(--radius-sm);
    border:1px solid var(--line); background:var(--bg); color:var(--ink);
    font-size:13px; font-family:'Noto Sans KR', sans-serif;
  }
  .detail-compare-result{
    font-size:12.5px; color:var(--ink-soft); line-height:1.6;
    margin:10px 0 0;
  }

  .empty-note{
    font-size:12.5px;
    color:var(--ink-soft);
    text-align:center;
    padding:16px 6px 4px;
    line-height:1.6;
  }

  /* ---- Meditation nap ---- */
  .med-card{
    position:relative;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 8px 8px;
    text-align:center;
  }
  .med-settings-btn{
    position:absolute; top:0; right:8px;
    width:32px; height:32px; border-radius:50%;
    border:1px solid var(--line); background:var(--surface);
    color:var(--ink-soft); font-size:14px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .med-settings-panel{
    width:100%; max-width:280px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin:0 0 22px;
    text-align:left;
  }
  .med-settings-panel label{
    display:block; font-size:11.5px; color:var(--ink-soft); margin-bottom:10px; line-height:1.5;
  }
  .med-settings-panel input[type="range"]{ width:100%; accent-color:var(--gold); }
  .med-breathe{
    position:relative;
    width:180px; height:180px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:26px;
  }
  .med-ring{
    position:absolute; inset:0;
    border-radius:50%;
    border:1px solid var(--sage);
    opacity:0.3;
  }
  .med-ring.r2{ inset:20px; opacity:0.45; }
  .med-orb{
    position:absolute; inset:40px;
    border-radius:50%;
    background:radial-gradient(circle at 34% 28%, var(--sage-tint), var(--sage) 145%);
    transition:transform 0.6s ease;
  }
  .med-breathe.active .med-ring{ animation:medPulse 8s ease-in-out infinite; }
  .med-breathe.active .med-ring.r2{ animation-delay:0.25s; }
  .med-breathe.active .med-orb{ animation:medOrb 8s ease-in-out infinite; }
  @keyframes medPulse{
    0%,100%{ transform:scale(1); opacity:0.25; }
    50%{ transform:scale(1.16); opacity:0.55; }
  }
  @keyframes medOrb{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
  }
  .med-time{
    font-family:'Gowun Batang', serif;
    font-size:32px;
    font-weight:700;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
  }
  .med-phase{
    font-size:13px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .med-endtime{
    font-size:11.5px;
    color:var(--ink-soft);
    opacity:0.75;
    margin-top:3px;
    min-height:15px;
  }
  .med-outputs{
    display:flex; justify-content:center; gap:22px;
    margin:26px 0 4px;
  }
  .med-output{
    display:flex; flex-direction:column; align-items:center; gap:6px;
    background:transparent; border:none; cursor:pointer;
    font-size:11px; color:var(--ink-soft);
    font-family:'Noto Sans KR', sans-serif;
    padding:2px;
  }
  .med-output-ic{
    width:44px; height:44px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    border:1.3px solid var(--line);
    background:var(--surface);
  }
  .med-output.active{ color:var(--gold-deep); font-weight:600; }
  :root[data-theme="dark"] .med-output.active, :root:not([data-theme="light"]) .med-output.active{ color:var(--gold); }
  .med-output.active .med-output-ic{
    border-color:var(--gold); background:var(--gold-tint);
  }
  .med-presets{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px;
    margin:24px 0 22px;
  }
  .med-chip{
    padding:9px 16px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-size:13px; font-weight:500;
    cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
  }
  .med-chip.active{
    background:var(--ink); border-color:var(--ink);
    color:var(--gold-deep); font-weight:600;
  }
  :root[data-theme="dark"] .med-chip.active, :root:not([data-theme="light"]) .med-chip.active{ color:var(--gold); }
  .med-main-btn{
    width:100%; max-width:280px;
    padding:15px; border-radius:999px;
    border:1px solid var(--ink);
    background:var(--ink); color:var(--bg);
    font-size:14.5px; font-weight:600;
    cursor:pointer;
    font-family:'Noto Sans KR', sans-serif;
  }
  .med-main-btn.stop{
    background:transparent; color:var(--danger); border-color:var(--danger);
  }
  .med-main-btn.ringing{
    background:var(--gold); border-color:var(--gold); color:var(--ink);
    font-size:16px; font-weight:700;
    animation:medRingPulse 1s ease-in-out infinite;
  }
  @keyframes medRingPulse{
    0%,100%{ transform:scale(1); box-shadow:0 0 0 0 rgba(169,131,74,0.4); }
    50%{ transform:scale(1.03); box-shadow:0 0 0 10px rgba(169,131,74,0); }
  }
  .med-hint{
    max-width:280px;
    margin:20px 0 0;
    font-size:12px; color:var(--ink-soft); line-height:1.6;
  }

  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(10,10,12,0.55);
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 0.2s ease;
    z-index:50;
  }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }
  .modal-card{
    width:100%; max-width:480px;
    background:var(--surface);
    border-radius:20px 20px 0 0;
    padding:24px 22px calc(30px + env(safe-area-inset-bottom));
    max-height:78vh;
    overflow-y:auto;
    transform:translateY(12px);
    transition:transform 0.2s ease;
  }
  .modal-overlay.show .modal-card{ transform:translateY(0); }
  .modal-card .modal-top{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; }
  .modal-card .close-btn{
    border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    width:26px;height:26px;border-radius:50%;
    font-size:12px; cursor:pointer; flex:none;
  }
  .modal-card h2{
    font-family:'Gowun Batang', serif;
    font-size:19px; line-height:1.45; margin:12px 0 8px;
    font-weight:700;
  }
  .modal-card .modal-date{ font-size:12px; color:var(--ink-soft); margin-bottom:18px; }
  .modal-card .modal-body{
    font-size:14.5px; line-height:1.85; color:var(--ink);
    white-space:pre-line;
    border-top:1px solid var(--line);
    padding-top:18px;
  }

  .bldg-illust{
    width:100%; height:150px;
    border-radius:10px;
    margin-bottom:16px;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .bldg-illust svg{ height:80%; width:auto; }
  .bldg-illust img{ width:100%; height:100%; object-fit:cover; }

  .photo-actions{
    display:flex; gap:14px; margin:10px 0 4px;
    font-size:12px;
  }
  .photo-actions label, .photo-actions span{
    color:var(--gold-deep); font-weight:600; cursor:pointer;
  }
  .photo-actions .remove{ color:var(--ink-soft); font-weight:500; display:none; }
  .photo-actions.has-photo .remove{ display:inline; }

  .map-app-row{ display:flex; gap:8px; margin-top:4px; }
  .map-app-btn{
    flex:1;
    text-align:center;
    text-decoration:none;
    font-size:12.5px; font-weight:700;
    padding:10px 6px;
    border-radius:10px;
    border:1px solid var(--line);
    color:var(--ink);
    background:transparent;
  }
  .map-app-btn.google{ background:#4285F4; border-color:#4285F4; color:#fff; }
  .map-app-btn.kakao{ background:#FEE500; border-color:#FEE500; color:#3c1e1e; }
  .map-app-btn.naver{ background:#03C75A; border-color:#03C75A; color:#fff; }

  nav.tabbar{
    flex:none;
    display:flex;
    background:var(--surface);
    border-bottom:1px solid var(--line);
    padding:0 20px;
  }
  nav.tabbar button{
    flex:1;
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    color:var(--ink-soft);
    font-family:'Noto Sans KR', sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    padding:13px 0;
  }
  nav.tabbar button .ic{font-size:15px; opacity:0.7;}
  nav.tabbar button.active{color:var(--gold-deep); font-weight:600; border-bottom-color:var(--gold);}
  nav.tabbar button.active .ic{opacity:1;}
  :root[data-theme="dark"] nav.tabbar button.active, :root:not([data-theme="light"]) nav.tabbar button.active{color:var(--gold);}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <h1>원광<span class="hanja">圓光</span></h1>
    <div class="ring"></div>
  </header>

  <nav class="tabbar">
    <button class="tab-btn active" data-view="home" aria-label="홈"><span class="ic" aria-hidden="true">🏠</span>홈</button>
    <button class="tab-btn" data-view="map" aria-label="캠퍼스 지도"><span class="ic" aria-hidden="true">🗺️</span>지도</button>
    <button class="tab-btn" data-view="search" aria-label="건물 검색"><span class="ic" aria-hidden="true">🔍</span>검색</button>
    <button class="tab-btn" data-view="notice" aria-label="공지사항"><span class="ic" aria-hidden="true">📋</span>공지</button>
  </nav>

  <main>
    <!-- ============ NOTICE VIEW ============ -->
    <!-- ============ HOME VIEW ============ -->
    <section id="view-home" class="view active">
      <div class="home-hero">
        <p class="home-eyebrow">원광대 캠퍼스 도우미</p>
        <h2 class="home-title">어디로 가시나요?</h2>
        <div class="bldg-search home-search">
          <span class="search-ic" aria-hidden="true">🔍</span>
          <input id="home-search-input" type="text" inputmode="search" placeholder="건물명, 건물번호로 검색 (예: 59, 학생회관)" aria-label="건물 검색">
        </div>
        <p class="home-hint">현재 위치에서 목적지까지 빠르게 찾아보세요.</p>
      </div>

      <div class="home-recent" id="home-recent" hidden>
        <div class="section-label">최근 검색</div>
        <div class="home-recent-list" id="home-recent-list"></div>
      </div>

      <div class="section-label">빠른 기능</div>
      <div class="home-quick-grid">
        <button class="home-quick-btn" data-goto="map"><span aria-hidden="true">🗺️</span>캠퍼스 지도</button>
        <button class="home-quick-btn" id="home-locate-btn"><span aria-hidden="true">📍</span>내 위치</button>
        <button class="home-quick-btn" data-goto="notice"><span aria-hidden="true">📢</span>공지사항</button>
        <button class="home-quick-btn" data-goto="meditation"><span aria-hidden="true">🌙</span>명상냅</button>
      </div>
      <p class="home-locate-status" id="home-locate-status"></p>
    </section>

    <section id="view-notice" class="view">
      <div class="chips" id="chips"></div>
      <div id="notice-list"></div>
    </section>

    <!-- ============ MAP VIEW ============ -->
    <section id="view-map" class="view">
      <div class="map-card">
        <div class="map-outer">
        <div class="map-img-wrap" id="map-img-wrap">

<script>
/* ---------------- 실제 공지 데이터 (Supabase에서 불러옴) ---------------- */
const SUPABASE_URL = "https://aopfvqjllmzulxbtalmo.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvcGZ2cWpsbG16dWx4YnRhbG1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1NDIwMzMsImV4cCI6MjEwNTExODAzM30.iKC5CfqUM3qy6uJbZSGbOwQyrM9bkLWosScKdieDUkM";

let NOTICES = [];
const CAT_LABEL = {academic:"학사공지", scholarship:"장학공지", job:"채용공고", campus:"교내소식"};
const CAT_ORDER = ["academic","scholarship","job","campus"];
let activeCat = "all";

async function loadNotices(){
  const list = document.getElementById('notice-list');
  list.innerHTML = `<div class="empty-note">공지사항을 불러오는 중...</div>`;
  try{
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/notices?select=*&order=posted_date.desc&limit=100`,
      { headers: { apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` } }
    );
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    NOTICES = rows.map(row=>({
      cat: row.category,
      title: row.title,
      date: row.posted_date || "날짜 미기재",
      ddays: null,
      body: row.body || "상세 내용이 준비되지 않았어요.",
      url: row.url || null,
    }));
  } catch(e){
    console.error("공지 불러오기 실패:", e);
    list.innerHTML = `<div class="empty-note">공지사항을 불러오지 못했어요. 잠시 후 다시 시도해주세요.</div>`;
    return;
  }
  renderNotices();
}

function renderChips(){
  const wrap = document.getElementById('chips');
  const cats = ["all", ...CAT_ORDER];
  wrap.innerHTML = cats.map(c=>{
    const label = c==="all" ? "전체" : CAT_LABEL[c];
    return `<div class="chip ${c===activeCat?'active':''}" data-cat="${c}">${label}</div>`;
  }).join('');
  wrap.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('click', ()=>{ activeCat = el.dataset.cat; renderChips(); renderNotices(); });
  });
}

function noticeCardHtml(n){
  const idx = NOTICES.indexOf(n);
  const ddayHtml = n.ddays!=null ? `<span class="d-day">D-${n.ddays}</span>` : '';
  return `
    <div class="notice-card" data-idx="${idx}">
      <span class="tag">${CAT_LABEL[n.cat]}</span>
      <h3>${n.title}</h3>
      <div class="meta"><span>${n.date}</span>${ddayHtml}</div>
    </div>`;
}

function renderNotices(){
  const list = document.getElementById('notice-list');

  if(activeCat === "all"){
    // grouped by category
    let html = "";
    CAT_ORDER.forEach(cat=>{
      const items = NOTICES.filter(n=>n.cat===cat);
      if(items.length===0) return;
      html += `<div class="group-label">${CAT_LABEL[cat]}</div>`;
      html += items.map(noticeCardHtml).join('');
    });
    list.innerHTML = html || `<div class="empty-note">등록된 공지가 없어요.</div>`;
  } else {
    const items = NOTICES.filter(n => n.cat===activeCat);
    list.innerHTML = items.map(noticeCardHtml).join('') || `<div class="empty-note">해당 카테고리의 공지가 없어요.</div>`;
  }

  list.querySelectorAll('.notice-card').forEach(el=>{
    el.addEventListener('click', ()=> openNoticeModal(Number(el.dataset.idx)));
  });
}

function openNoticeModal(idx){
  const n = NOTICES[idx];
  document.getElementById('modal-tag').textContent = CAT_LABEL[n.cat];
  document.getElementById('modal-title').textContent = n.title;
  document.getElementById('modal-date').textContent = n.date;
  document.getElementById('modal-body').textContent = n.body || "상세 내용이 준비되지 않았어요.";
  const linkEl = document.getElementById('modal-link');
  if(n.url){
    linkEl.href = n.url;
    linkEl.style.display = 'inline-block';
  } else {
    linkEl.style.display = 'none';
  }
  document.getElementById('notice-modal').classList.add('show');
}
function closeNoticeModal(){
  document.getElementById('notice-modal').classList.remove('show');
}

let userPos = null;
let selectedBuilding = null;

function toRad(d){ return d*Math.PI/180; }

function haversine(lat1,lon1,lat2,lon2){
  const R = 6371000;
  const dLat = toRad(lat2-lat1);
  const dLon = toRad(lon2-lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
let bldgQuery = "";

function highlightMatch(text, q){
  if(!q) return text;
  const idx = text.indexOf(q);
  if(idx === -1) return text;
  return text.slice(0,idx) + `<span class="hl-match">${text.slice(idx, idx+q.length)}</span>` + text.slice(idx+q.length);
}

function renderBuildings(){
  const list = document.getElementById('bldg-list');
  const emptyNote = document.getElementById('bldg-empty');
  const q = bldgQuery.trim().toLowerCase();
  const filtered = BUILDINGS.filter(b => !q
    || b.name.toLowerCase().includes(q)
    || b.id.toLowerCase().includes(q)
    || b.sub.toLowerCase().includes(q));

  if(filtered.length === 0){
    list.innerHTML = '';
    // 강의실 코드처럼 보이는 검색어(예: B101)인지 대략 판별해서 안내를 다르게 보여준다
    const looksLikeRoomCode = /[a-z]/i.test(q) && /\d/.test(q) && q.length <= 8;
    emptyNote.textContent = looksLikeRoomCode
      ? '강의실 검색은 아직 준비 중이에요. 건물명이나 건물번호로 검색해보세요.'
      : `'${bldgQuery.trim()}'와 일치하는 건물이 없어요. 건물명이나 건물번호를 다시 확인해주세요.`;
    return;
  }
  emptyNote.textContent = "건물을 탭하면 사진·정보·지도를 볼 수 있어요.";

  list.innerHTML = filtered.map(b=>{
    let distTxt = "--";
    if(userPos && b.lat!=null){
      const d = haversine(userPos.lat,userPos.lng,b.lat,b.lng);
      distTxt = d<1000 ? `${Math.round(d)}m` : `${(d/1000).toFixed(1)}km`;
    }
    return `
      <div class="bldg-row ${selectedBuilding===b.id?'selected':''}" data-id="${b.id}">
        <div class="bldg-badge" style="font-size:${b.id.length>2?'10px':'12.5px'}">${highlightMatch(b.id, q)}</div>
        <div class="bldg-info">
          <div class="name">${highlightMatch(b.name, q)}</div>
          <div class="sub">${b.sub}</div>
        </div>
        <div class="bldg-dist">${distTxt}</div>
      </div>`;
  }).join('');
  list.querySelectorAll('.bldg-row').forEach(el=>{
    el.addEventListener('click', ()=> selectBuilding(el.dataset.id));
  });
}

document.getElementById('bldg-search-input').addEventListener('input', (e)=>{
  bldgQuery = e.target.value;
  if(selectedBuilding != null){
    selectedBuilding = null;
    updateDetail();
  }
  renderBuildings();
  renderMap();
});

function getSavedPhoto(id){
  try{ return localStorage.getItem(`wku_photo_${id}`); }catch(e){ return null; }
}

function renderIllust(b){
  const photo = getSavedPhoto(b.id);
  const box = document.getElementById('bldg-illust');
  const actions = document.getElementById('photo-actions');
  if(photo){
    box.innerHTML = `<img src="${photo}" alt="${b.name}">`;
    actions.classList.add('has-photo');
    document.querySelector('#photo-actions label').textContent = "📷 사진 변경";
  } else {
    box.innerHTML = ILLUSTRATIONS[b.illust] || '';
    actions.classList.remove('has-photo');
    document.querySelector('#photo-actions label').textContent = "📷 사진 추가";
  }
}

function estimateWalkMinutes(meters){ return Math.max(1, Math.round(meters/70)); }
function estimateRunMinutes(meters){ return Math.max(1, Math.round(meters/150)); }

function updateDetailDistLine(b){
  const wrap = document.getElementById('detail-dist-line');
  const el = document.getElementById('detail-dist-text');
  if(b.lat == null){
    el.textContent = '정확한 위치 정보 준비중이에요';
    wrap.classList.remove('clickable');
    wrap.onclick = null;
    return;
  }
  if(!userPos){
    el.textContent = '내 위치를 확인하면 거리를 알 수 있어요 →';
    wrap.classList.add('clickable');
    wrap.onclick = requestUserLocation;
    return;
  }
  const d = haversine(userPos.lat,userPos.lng,b.lat,b.lng);
  const distTxt = d<1000 ? `${Math.round(d)}m` : `${(d/1000).toFixed(2)}km`;
  el.textContent = `내 위치에서 약 ${distTxt} · 도보 ${estimateWalkMinutes(d)}분 · 달리기 ${estimateRunMinutes(d)}분`;
  wrap.classList.remove('clickable');
  wrap.onclick = requestUserLocation;
}

function setupCompare(a){
  const sel = document.getElementById('compare-select');
  const resultEl = document.getElementById('detail-compare-result');
  resultEl.textContent = '';
  sel.value = '';
  if(a.lat == null){
    sel.innerHTML = '';
    sel.disabled = true;
    resultEl.textContent = '이 건물은 정확한 위치 정보가 없어 다른 건물과의 거리를 비교할 수 없어요.';
    return;
  }
  sel.disabled = false;
  const options = BUILDINGS.filter(b=>b.id!==a.id && b.lat!=null);
  sel.innerHTML = '<option value="">건물을 선택하세요</option>' +
    options.map(b=>`<option value="${b.id}">${b.id}. ${b.name}</option>`).join('');
}

document.getElementById('compare-select').addEventListener('change', (e)=>{
  const resultEl = document.getElementById('detail-compare-result');
  const otherId = e.target.value;
  if(!otherId){ resultEl.textContent = ''; return; }
  const a = BUILDINGS.find(x=>x.id===selectedBuilding);
  const b = BUILDINGS.find(x=>x.id===otherId);
  if(!a || !b || a.lat==null || b.lat==null){
    resultEl.textContent = '두 건물 중 위치 정보가 없는 곳이 있어 거리를 계산할 수 없어요.';
    return;
  }
  const d = haversine(a.lat,a.lng,b.lat,b.lng);
  const distTxt = d<1000 ? `${Math.round(d)}m` : `${(d/1000).toFixed(2)}km`;
  resultEl.textContent = `${a.name} → ${b.name}: 약 ${distTxt} · 도보 ${estimateWalkMinutes(d)}분 · 달리기 ${estimateRunMinutes(d)}분`;
});

function updateDetail(){
  const detailEl = document.getElementById('detail');
  if(selectedBuilding==null){ detailEl.hidden = true; return; }
  const b = BUILDINGS.find(x=>x.id===selectedBuilding);
  if(!b){ detailEl.hidden = true; return; }
  detailEl.hidden = false;
  document.getElementById('detail-name').textContent = b.name;
  document.getElementById('detail-info').textContent = b.info || b.sub;
  renderIllust(b);
  updateDetailDistLine(b);
  setupCompare(b);

  const query = encodeURIComponent(`원광대학교 ${b.name}`);
  document.getElementById('open-google').href = `https://www.google.com/maps/search/?api=1&query=${query}`;
  document.getElementById('open-kakao').href = `https://map.kakao.com/link/search/${query}`;
  document.getElementById('open-naver').href = `https://map.naver.com/p/search/${query}`;
}

document.getElementById('photo-input').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file || selectedBuilding==null) return;
  const img = new Image();
  const reader = new FileReader();
  reader.onload = (ev)=>{
    img.onload = ()=>{
      const maxW = 640;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      const dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      try{
        localStorage.setItem(`wku_photo_${selectedBuilding}`, dataUrl);
        renderIllust(BUILDINGS.find(x=>x.id===selectedBuilding));
      }catch(err){
        alert("사진 저장에 실패했어요. 용량이 너무 클 수 있어요.");
      }
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});

document.getElementById('photo-remove').addEventListener('click', ()=>{
  if(selectedBuilding==null) return;
  try{ localStorage.removeItem(`wku_photo_${selectedBuilding}`); }catch(e){}
  renderIllust(BUILDINGS.find(x=>x.id===selectedBuilding));
});

/* ---------------- Mini-map (실제 캠퍼스맵 이미지 위에 핀 오버레이) ---------------- */
function renderMap(){
  const pinsWrap = document.getElementById('map-pins');
  const q = bldgQuery.trim();

  pinsWrap.innerHTML = BUILDINGS.map(b=>{
    const sel = b.id===selectedBuilding;
    const matched = q && (b.name.includes(q) || b.id.includes(q) || b.sub.includes(q));
    const leftPct = (b.px/MAP_IMG_W*100).toFixed(2);
    const topPct = (b.py/MAP_IMG_H*100).toFixed(2);
    return `<div class="map-pin ${sel?'selected':''} ${matched?'matched':''}" data-id="${b.id}" style="left:${leftPct}%; top:${topPct}%;" title="${b.id}. ${b.name}"></div>`;
  }).join('');

  pinsWrap.querySelectorAll('.map-pin').forEach(el=>{
    el.addEventListener('click', ()=> onPinTap(el.dataset.id));
  });
}

function selectBuilding(id){
  selectedBuilding = (selectedBuilding === id) ? null : id;
  renderBuildings();
  updateDetail();
  renderMap();
  if(selectedBuilding){
    const b = BUILDINGS.find(x=>x.id===selectedBuilding);
    if(b) pushRecentSearch(b);
    document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'nearest'});
  }
}

document.getElementById('detail-map-btn').addEventListener('click', ()=>{
  const id = selectedBuilding;
  switchView('map');
  if(id) showMapPopoverContent(id);

/* ---------------- Recent searches (local only, never sent to a server) ---------------- */
function pushRecentSearch(b){
  try{
    let list = JSON.parse(localStorage.getItem('wku_recent_searches') || '[]');
    list = list.filter(x=>x.id !== b.id);
    list.unshift({id:b.id, name:b.name});
    list = list.slice(0,5);
    localStorage.setItem('wku_recent_searches', JSON.stringify(list));
  }catch(e){}
  renderRecentSearches();
}
function renderRecentSearches(){
  let list = [];
  try{ list = JSON.parse(localStorage.getItem('wku_recent_searches') || '[]'); }catch(e){}
  const wrap = document.getElementById('home-recent');
  const listEl = document.getElementById('home-recent-list');
  if(!list.length){ wrap.hidden = true; return; }
  wrap.hidden = false;
  listEl.innerHTML = list.map(b=>`<button class="home-recent-chip" data-id="${b.id}">${b.name}</button>`).join('');
  listEl.querySelectorAll('.home-recent-chip').forEach(el=>{
    el.addEventListener('click', ()=>{
      switchView('search');
      selectedBuilding = null;
      selectBuilding(el.dataset.id);
    });
  });
}

/* ---------------- Pan & zoom ---------------- */
let mapPanX = 0, mapPanY = 0, mapZoom = 1;
let mapDragging = false, mapLastX = 0, mapLastY = 0;
let mapDidDrag = false;

function applyMapTransform(){
  const inner = document.getElementById('map-img-inner');
  if(!inner) return;
  inner.style.transform = `translate(${mapPanX}px,${mapPanY}px) scale(${mapZoom})`;
}

(function setupMapPanZoom(){
  const wrap = document.getElementById('map-img-wrap');
  const activePointers = new Map();
  let pinchStartDist = 0, pinchStartZoom = 1;

  wrap.addEventListener('pointerdown', (e)=>{
    wrap.setPointerCapture(e.pointerId);
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    mapDidDrag = false;

    if(activePointers.size === 1){
      mapDragging = true;
      mapLastX = e.clientX; mapLastY = e.clientY;
    } else if(activePointers.size === 2){
      mapDragging = false;
      const pts = [...activePointers.values()];
      pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y) || 1;
      pinchStartZoom = mapZoom;
    }
  });

  wrap.addEventListener('pointermove', (e)=>{
    if(!activePointers.has(e.pointerId)) return;
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});

    if(activePointers.size >= 2){
      const pts = [...activePointers.values()];
      const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
      mapZoom = Math.min(4, Math.max(1, pinchStartZoom * (dist/pinchStartDist)));
      applyMapTransform();
      return;
    }

    if(!mapDragging) return;
    const dx = e.clientX - mapLastX;
    const dy = e.clientY - mapLastY;
    if(Math.abs(dx)>2 || Math.abs(dy)>2) mapDidDrag = true;
    mapPanX += dx; mapPanY += dy;
    mapLastX = e.clientX; mapLastY = e.clientY;
    applyMapTransform();
  });

  wrap.addEventListener('pointerup', (e)=>{
    if(!mapDidDrag){
      const hit = document.elementFromPoint(e.clientX, e.clientY);
      const pin = hit && hit.closest ? hit.closest('.map-pin') : null;
      if(pin){ selectBuilding(pin.dataset.id); }
    }
  });

  ['pointerup','pointerleave','pointercancel'].forEach(evt=>{
    wrap.addEventListener(evt, (e)=>{
      activePointers.delete(e.pointerId);
      if(activePointers.size === 0){
        mapDragging = false;
      } else if(activePointers.size === 1){
        const remaining = [...activePointers.values()][0];
        mapDragging = true;
        mapLastX = remaining.x; mapLastY = remaining.y;
      }
    });
  });

  document.getElementById('zoom-in').addEventListener('click', ()=>{
    mapZoom = Math.min(4, mapZoom * 1.35);
    applyMapTransform();
  });
  document.getElementById('zoom-out').addEventListener('click', ()=>{
    mapZoom = Math.max(1, mapZoom / 1.35);
    if(mapZoom<=1){ mapPanX=0; mapPanY=0; }
    applyMapTransform();
  });
  document.getElementById('zoom-reset').addEventListener('click', ()=>{
    mapZoom = 1; mapPanX = 0; mapPanY = 0;
    applyMapTransform();
  });

  const fsBtn = document.getElementById('map-fullscreen-btn');
  const mapOuter = document.querySelector('.map-outer');
  let mapFullscreen = false;
  fsBtn.addEventListener('click', ()=>{
    mapFullscreen = !mapFullscreen;
    mapOuter.classList.toggle('fullscreen', mapFullscreen);
    fsBtn.textContent = mapFullscreen ? '✕' : '⛶';
    fsBtn.setAttribute('aria-label', mapFullscreen ? '전체화면 닫기' : '전체화면');
  });
})();

function requestUserLocation(){
  const homeStatus = document.getElementById('home-locate-status');
  const distText = document.getElementById('detail-dist-text');
  const setStatus = (msg)=>{
    if(homeStatus) homeStatus.textContent = msg;
    if(distText && selectedBuilding != null) distText.textContent = msg;
  };
  if(!navigator.geolocation){
    setStatus('이 브라우저는 위치 확인을 지원하지 않아요.');
    return;
  }
  setStatus('현재 위치를 확인하고 있어요...');
  navigator.geolocation.getCurrentPosition(
    pos=>{
      userPos = {lat:pos.coords.latitude, lng:pos.coords.longitude};
      const acc = Math.round(pos.coords.accuracy);
      const accNote = acc > 100 ? ' (정확도가 낮을 수 있어요)' : '';
      setStatus(`현재 위치 확인 완료 (오차 약 ${acc}m)${accNote}`);
      renderBuildings();
      updateDetail();
      renderMap();
    },
    err=>{
      setStatus('현재 위치를 확인할 수 없어요. 브라우저의 위치 권한을 허용해주세요.');
    },
    {enableHighAccuracy:true, timeout:10000}
  );
}
document.getElementById('home-locate-btn').addEventListener('click', requestUserLocation);

/* ---------------- View switching (tabs + programmatic navigation) ---------------- */
let noticeScrollTop = 0;
let currentView = 'home';

function switchView(v){
  if(v === currentView) return;
  const mainEl = document.querySelector('main');
  if(currentView === 'notice'){ noticeScrollTop = mainEl.scrollTop; }

  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.view === v));
  document.querySelectorAll('.view').forEach(sec=>sec.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');

  mainEl.scrollTop = (v === 'notice') ? noticeScrollTop : 0;
  currentView = v;
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=> switchView(btn.dataset.view));
});

document.querySelectorAll('.home-quick-btn[data-goto]').forEach(btn=>{
  btn.addEventListener('click', ()=> switchView(btn.dataset.goto));
});

/* ---------------- Home search: types once, lands in search results ---------------- */
document.getElementById('home-search-input').addEventListener('input', (e)=>{
  const val = e.target.value;
  const searchInput = document.getElementById('bldg-search-input');
  searchInput.value = val;
  bldgQuery = val;
  renderBuildings();
  switchView('search');
  searchInput.focus();
});

/* ---------------- Header auto-hide on scroll ---------------- */
(function(){
  const mainEl = document.querySelector('main');
  const header = document.querySelector('header.top');
  let lastTop = 0;

  mainEl.addEventListener('scroll', ()=>{
    const top = mainEl.scrollTop;
    if(top <= 0){
      header.classList.remove('collapsed');
    } else if(top > lastTop + 4){
      header.classList.add('collapsed');
    } else if(top < lastTop - 4){
      header.classList.remove('collapsed');
    }
    lastTop = top <= 0 ? 0 : top;
  }, {passive:true});
})();

/* ---------------- Meditation nap ---------------- */
let medDurationSec = 1*60;
let medRemainingSec = medDurationSec;
let medEndAt = null;
let medTimerId = null;
let medBreathTimerId = null;
let medFeedbackTimerId = null;
let medRunning = false;
let medRinging = false;
let medOutputMode = 'earphone';
let medAudioCtx = null;
let medRingTimerId = null;
let medRingStartAt = 0;
const MED_RING_FADE_MS = 20000;
const MED_RING_INTERVAL_MS = 2200;

let medAlarmVolume = 0.7;
try{
  const savedVol = localStorage.getItem('wku_med_volume');
  if(savedVol != null) medAlarmVolume = Math.max(0, Math.min(1, parseFloat(savedVol)));
}catch(e){}

function medFormat(s){
  const m = Math.floor(s/60), sec = s%60;
  return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}
function medUpdateDisplay(){
  document.getElementById('med-time').textContent = medFormat(Math.max(0, medRemainingSec));
  const endEl = document.getElementById('med-endtime');
  if(medRunning && medEndAt){
    const d = new Date(medEndAt);
    endEl.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}에 끝나요`;
  } else {
    endEl.textContent = '';
  }
}

document.querySelectorAll('.med-chip').forEach(chip=>{
  chip.addEventListener('click', ()=>{
    const min = Number(chip.dataset.min);
    if(medRunning){
      medEndAt += min*60*1000;
      medRemainingSec += min*60;
      medUpdateDisplay();
      medFlashPhase(`${min}분 추가됐어요`);
    } else {
      document.querySelectorAll('.med-chip').forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      medDurationSec = min*60;
      medRemainingSec = medDurationSec;
      medUpdateDisplay();
    }
  });
});

document.querySelectorAll('.med-output').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.med-output').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    medOutputMode = btn.dataset.mode;
  });
});

const medVolumeSlider = document.getElementById('med-volume-slider');
medVolumeSlider.value = Math.round(medAlarmVolume*100);
medVolumeSlider.addEventListener('input', (e)=>{
  medAlarmVolume = Number(e.target.value)/100;
  try{ localStorage.setItem('wku_med_volume', String(medAlarmVolume)); }catch(err){}
});

document.getElementById('med-settings-btn').addEventListener('click', ()=>{
  const panel = document.getElementById('med-settings-panel');
  panel.hidden = !panel.hidden;
});

function medUnlockAudio(){
  try{
    if(!medAudioCtx){
      medAudioCtx = new (window.AudioContext||window.webkitAudioContext)();
    }
    if(medAudioCtx.state === 'suspended'){ medAudioCtx.resume(); }
    const osc = medAudioCtx.createOscillator();
    const gain = medAudioCtx.createGain();
    gain.gain.value = 0.0001;
    osc.connect(gain).connect(medAudioCtx.destination);
    osc.start();
    osc.stop(medAudioCtx.currentTime + 0.05);
  }catch(e){}
}

function medPlayTone(ctx, startOffset, freq, len, vol){
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(0, now+startOffset);
  gain.gain.linearRampToValueAtTime(vol, now+startOffset+0.06);
  gain.gain.exponentialRampToValueAtTime(0.001, now+startOffset+len);
  osc.connect(gain).connect(ctx.destination);
  osc.start(now+startOffset);
  osc.stop(now+startOffset+len+0.05);
}

function medPlayChime(volOverride){
  const baseVol = (typeof volOverride === 'number') ? volOverride : medAlarmVolume;
  const vol = medOutputMode === 'speaker' ? Math.min(1, baseVol*1.3) : baseVol;
  if(medOutputMode !== 'vibrate' && vol > 0.01){
    try{
      if(!medAudioCtx){ medAudioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
      if(medAudioCtx.state === 'suspended'){ medAudioCtx.resume(); }
      medPlayTone(medAudioCtx, 0, 660, 0.55, vol);
      medPlayTone(medAudioCtx, 0.55, 600, 0.55, vol);
    }catch(e){}
  }
  if(navigator.vibrate){
    navigator.vibrate(medOutputMode === 'earphone' ? [150,80,150] : [200,100,200,100,300]);
  }
}

function medRingTick(){
  const elapsed = Date.now() - medRingStartAt;
  const fade = Math.min(1, elapsed / MED_RING_FADE_MS);
  const vol = medAlarmVolume * (0.12 + 0.88*fade);
  medPlayChime(vol);
}

function medFlashPhase(text){
  const phaseEl = document.getElementById('med-phase');
  clearTimeout(medFeedbackTimerId);
  const prev = medRunning ? (document.getElementById('med-breathe').dataset.inhale === '1' ? '천천히 들이쉬세요' : '천천히 내쉬세요') : phaseEl.textContent;
  phaseEl.textContent = text;
  medFeedbackTimerId = setTimeout(()=>{ phaseEl.textContent = prev; }, 1400);
}

function medStartBreathing(){
  const phaseEl = document.getElementById('med-phase');
  const breatheEl = document.getElementById('med-breathe');
  breatheEl.classList.add('active');
  let inhale = true;
  breatheEl.dataset.inhale = '1';
  phaseEl.textContent = '천천히 들이쉬세요';
  medBreathTimerId = setInterval(()=>{
    inhale = !inhale;
    breatheEl.dataset.inhale = inhale ? '1' : '0';
    phaseEl.textContent = inhale ? '천천히 들이쉬세요' : '천천히 내쉬세요';
  }, 4000);
}
function medStopBreathing(){
  clearInterval(medBreathTimerId);
  document.getElementById('med-breathe').classList.remove('active');
}

function medSetIdleUI(){
  const btn = document.getElementById('med-start-btn');
  btn.textContent = '명상 냅 시작';
  btn.classList.remove('stop');
  btn.classList.remove('ringing');
}

function medTick(){
  if(!medRunning) return;
  medRemainingSec = Math.round((medEndAt - Date.now())/1000);
  medUpdateDisplay();
  if(medRemainingSec<=0) medFinish();
}

function medStart(){
  medRunning = true;
  medUnlockAudio();
  medEndAt = Date.now() + medRemainingSec*1000;
  const btn = document.getElementById('med-start-btn');
  btn.textContent = '중지하기';
  btn.classList.add('stop');
  medStartBreathing();
  medUpdateDisplay();
  clearInterval(medTimerId);
  medTimerId = setInterval(medTick, 250);
}

function medFinish(){
  clearInterval(medTimerId);
  medStopBreathing();
  medRunning = false;
  medRinging = true;
  document.getElementById('med-phase').textContent = '일어날 시간이에요';
  document.getElementById('med-endtime').textContent = '';
  document.getElementById('med-outputs').style.visibility = 'hidden';
  document.getElementById('med-presets').style.visibility = 'hidden';
  const btn = document.getElementById('med-start-btn');
  btn.textContent = '🔔 알람 중지하기';
  btn.classList.remove('stop');
  btn.classList.add('ringing');

  medRingStartAt = Date.now();
  medRingTick();
  clearInterval(medRingTimerId);
  medRingTimerId = setInterval(medRingTick, MED_RING_INTERVAL_MS);
}

function medDismissAlarm(){
  clearInterval(medRingTimerId);
  medRinging = false;
  medRemainingSec = medDurationSec;
  medUpdateDisplay();
  document.getElementById('med-phase').textContent = '시간을 선택하세요';
  document.getElementById('med-outputs').style.visibility = 'visible';
  document.getElementById('med-presets').style.visibility = 'visible';
  medSetIdleUI();
}

function medStop(){
  clearInterval(medTimerId);
  medStopBreathing();
  medRunning = false;
  medRemainingSec = medDurationSec;
  medUpdateDisplay();
  document.getElementById('med-phase').textContent = '시간을 선택하세요';
  medSetIdleUI();
}

document.getElementById('med-start-btn').addEventListener('click', ()=>{
  if(medRinging){ medDismissAlarm(); }
  else if(medRunning){ medStop(); }
  else { medStart(); }
});

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible'){
    if(medRunning){ medUnlockAudio(); medTick(); }
    if(medRinging){ medUnlockAudio(); }
  }
});

medUpdateDisplay();

/* ---------------- Init ---------------- */
document.getElementById('notice-modal').addEventListener('click', (e)=>{
  if(e.target.id === 'notice-modal') closeNoticeModal();
});
renderChips();
loadNotices();
renderBuildings();
renderMap();
renderRecentSearches();
</script>
